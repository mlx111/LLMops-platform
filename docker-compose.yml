# LLMOps 评测与监控平台 —— 一键启动
# 使用：docker compose up -d --build
# 访问：前端 http://localhost:5173 ，后端文档 http://localhost:8000/docs
services:
  redis:
    image: docker.1ms.run/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - docker.env
    environment:
      DATABASE_URL: sqlite:////app/data/llmops.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: "*"
      # 允许评测目标指向宿主机/内网自建 Agent（SSRF 防护的可信白名单，逗号分隔）
      LLMOPS_TARGET_ALLOWLIST: "host.docker.internal"
      # Langfuse judge 用量上报（compose 内网直达）
      LANGFUSE_HOST: http://langfuse:3000
      # Trace 事件管道：Kafka 削峰 + ClickHouse OLAP
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_TRACES: llmops.trace.events
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: llmops
      CLICKHOUSE_USER: llmops
      CLICKHOUSE_PASSWORD: llmops
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
      # demo_data 位于项目根目录，seed.py 从 /demo_data 读取初始化评测集
      - ./demo_data:/demo_data:ro
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  # Celery worker：与 backend 共用同一镜像，负责异步执行评测任务
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file:
      - docker.env
    environment:
      DATABASE_URL: sqlite:////app/data/llmops.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LLMOPS_TARGET_ALLOWLIST: "host.docker.internal"
      # Langfuse judge 用量上报（compose 内网直达）
      LANGFUSE_HOST: http://langfuse:3000
      # Trace 事件管道：Kafka 削峰 + ClickHouse OLAP
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_TRACES: llmops.trace.events
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: llmops
      CLICKHOUSE_USER: llmops
      CLICKHOUSE_PASSWORD: llmops
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  # MCP Server：把评测平台能力（发起 run / 查分 / 失败明细 / 回归对比）
  # 以 MCP streamable-http 协议暴露，外部 Agent（如 mypaperweb supervisor）
  # 可在运行时发现并调用，实现 Agent 自助评测闭环。端点：http://localhost:9000/mcp
  mcp:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.mcp_server:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      # MCP 进程通过 compose 内部网络调用 backend REST API
      LLMOPS_API_BASE: http://backend:8000
    ports:
      - "9000:9000"
    depends_on:
      - backend

  # ---- Trace 事件大数据管道：Kafka(KRaft) 削峰 + ClickHouse OLAP 聚合 ----
  # backend/worker 的 Tracer.end_trace 把 trace 事件发到 Kafka；
  # ch-worker 消费后批量写入 ClickHouse；Dashboard 高级分析默认查
  # ClickHouse，不可用时自动降级 SQLite 明细聚合。
  kafka:
    image: docker.1ms.run/apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  clickhouse:
    image: docker.1ms.run/clickhouse/clickhouse-server:24.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: llmops
      CLICKHOUSE_USER: llmops
      CLICKHOUSE_PASSWORD: llmops
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Kafka -> ClickHouse 消费者：批量写入 trace 事件（与 backend 共用镜像）
  ch-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.analytics_worker"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_TRACES: llmops.trace.events
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: llmops
      CLICKHOUSE_USER: llmops
      CLICKHOUSE_PASSWORD: llmops
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ---- Langfuse v2：LLM 可观测（trace + token 成本），llmops judge 与 mypaperweb 统一上报 ----
  langfuse-db:
    image: docker.1ms.run/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 3s
      retries: 10

  langfuse:
    image: docker.1ms.run/langfuse/langfuse:2
    restart: unless-stopped
    env_file:
      - langfuse.env
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      PORT: "3000"
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy

volumes:
  redis-data:
  backend-data:
  langfuse-db-data:
  clickhouse-data:
